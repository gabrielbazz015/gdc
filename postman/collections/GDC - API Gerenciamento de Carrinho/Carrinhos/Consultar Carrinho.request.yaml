$kind: http-request
name: 'Consultar Carrinho'
description: |-
  Retorna os dados de um carrinho específico pelo ID.
  Recurso: IMPLEMENTADO | Rota: GET /api/carrinhos/:id
method: GET
url: '{{base_url}}/api/carrinhos/:id'
order: 2000
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID do carrinho'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 ou 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
          pm.test("Resposta é JSON válido", function () {
              pm.response.to.be.json;
          });

          pm.test("Carrinho possui campos esperados", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'identificacao', 'localizacao', 'quantidade_notebooks');
          });
      }

      if (pm.response.code === 404) {
          pm.test("404 - Carrinho não encontrado", function () {
              pm.response.to.have.status(404);
          });
      }
