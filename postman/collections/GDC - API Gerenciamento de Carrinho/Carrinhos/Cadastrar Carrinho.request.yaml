$kind: http-request
name: 'Cadastrar Carrinho'
description: |-
  Cria um novo carrinho.
  Recurso: IMPLEMENTADO | Rota: POST /api/carrinhos
  Campos confirmados: identificacao, localizacao, quantidade_notebooks
method: POST
url: '{{base_url}}/api/carrinhos'
order: 3000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "identificacao": "CARR-001",
      "localizacao": "Sala 101",
      "quantidade_notebooks": 10
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 201 (criado) ou 422 (validação)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 422]);
      });

      pm.test("Resposta é JSON válido", function () {
          pm.response.to.be.json;
      });

      if (pm.response.code === 201 || pm.response.code === 200) {
          pm.test("Carrinho criado possui identificacao", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'identificacao');
          });
      }

      if (pm.response.code === 422) {
          pm.test("422 - Erros de validação presentes", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('errors', 'message');
          });
      }
