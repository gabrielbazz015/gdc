$kind: http-request
name: 'Excluir Empréstimo'
description: |-
  Remove um empréstimo pelo ID.
  Recurso: IMPLEMENTADO | Rota: DELETE /api/emprestimos/:id
method: DELETE
url: '{{base_url}}/api/emprestimos/:id'
order: 5000
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID do empréstimo a excluir'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200, 204 ou 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204, 404]);
      });

      if (pm.response.code === 404) {
          pm.test("404 - Empréstimo não encontrado", function () {
              pm.response.to.have.status(404);
          });
      }
