$kind: http-request
name: 'Atualizar Chave'
description: |-
  Atualiza os dados de uma chave existente.
  Recurso: IMPLEMENTADO | Rota: PUT /api/chaves/:id
  Campos confirmados: identificacao, status, id_carrinho
method: PUT
url: '{{base_url}}/api/chaves/:id'
order: 4000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID da chave a atualizar'
body:
  type: json
  content: |-
    {
      "identificacao": "CHAVE-001-ATUALIZADA",
      "status": "em_uso",
      "id_carrinho": 2
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200, 422 ou 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 422, 404]);
      });

      pm.test("Resposta é JSON válido", function () {
          pm.response.to.be.json;
      });

      if (pm.response.code === 200) {
          pm.test("Chave atualizada retorna dados", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'identificacao');
          });
      }

      if (pm.response.code === 422) {
          pm.test("422 - Erros de validação presentes", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('errors', 'message');
          });
      }

      if (pm.response.code === 404) {
          pm.test("404 - Chave não encontrada", function () {
              pm.response.to.have.status(404);
          });
      }
