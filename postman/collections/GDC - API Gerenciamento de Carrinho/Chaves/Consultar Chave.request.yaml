$kind: http-request
name: 'Consultar Chave'
description: |-
  Retorna os dados de uma chave específica pelo ID.
  Recurso: IMPLEMENTADO | Rota: GET /api/chaves/:id
method: GET
url: '{{base_url}}/api/chaves/:id'
order: 2000
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID da chave'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200 ou 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 404]);
      });

      if (pm.response.code === 200) {
          pm.test("Resposta é JSON válido", function () {
              pm.response.to.be.json;
          });

          pm.test("Chave possui campos esperados", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'identificacao', 'status', 'id_carrinho');
          });
      }

      if (pm.response.code === 404) {
          pm.test("404 - Chave não encontrada", function () {
              pm.response.to.have.status(404);
          });
      }
