$kind: http-request
name: 'Atualizar Usuário'
description: |-
  Atualiza os dados de um usuário existente.
  Recurso: IMPLEMENTADO | Rota: PUT /api/usuarios/:id
  Campos confirmados: nome, email, senha, tipo
method: PUT
url: '{{base_url}}/api/usuarios/:id'
order: 4000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '1'
    description: 'ID do usuário a atualizar'
body:
  type: json
  content: |-
    {
      "nome": "Maria Souza (atualizado)",
      "email": "maria.souza.novo@escola.edu.br",
      "senha": "nova_senha_456",
      "tipo": "professor"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200, 422 ou 404", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 422, 404]);
      });

      pm.test("Resposta é JSON válido", function () {
          pm.response.to.be.json;
      });

      if (pm.response.code === 200) {
          pm.test("Usuário atualizado retorna dados", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'nome', 'email');
          });
      }

      if (pm.response.code === 422) {
          pm.test("422 - Erros de validação presentes", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('errors', 'message');
          });
      }

      if (pm.response.code === 404) {
          pm.test("404 - Usuário não encontrado", function () {
              pm.response.to.have.status(404);
          });
      }
