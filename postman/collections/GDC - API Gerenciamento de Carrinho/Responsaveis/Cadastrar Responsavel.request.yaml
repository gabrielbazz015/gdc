$kind: http-request
name: 'Cadastrar Responsável'
description: |-
  Cria um novo responsável.
  Recurso: IMPLEMENTADO | Rota: POST /api/responsaveis
  Campos confirmados: nome, matricula
method: POST
url: '{{base_url}}/api/responsaveis'
order: 3000
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nome": "Prof. João Silva",
      "matricula": "MAT-2024-001"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200, 201 ou 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 422]);
      });

      pm.test("Resposta é JSON válido", function () {
          pm.response.to.be.json;
      });

      if (pm.response.code === 201 || pm.response.code === 200) {
          pm.test("Responsável criado possui nome", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('id', 'nome');
          });
      }

      if (pm.response.code === 422) {
          pm.test("422 - Erros de validação presentes", function () {
              const body = pm.response.json();
              pm.expect(body).to.have.any.keys('errors', 'message');
          });
      }
